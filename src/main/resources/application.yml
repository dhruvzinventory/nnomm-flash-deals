server:
  port: ${PORT:8080}

spring:
  application:
    name: nnomm-flash-deals
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/nnomm}
    username: ${DATABASE_USER:nnomm}
    password: ${DATABASE_PASSWORD:nnomm_local_dev}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
      connection-timeout: 10000
      idle-timeout: 60000
      max-lifetime: 1800000
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt-secret: ${JWT_SECRET:super-secret-jwt-key-for-local-testing-purposes-123}
  webhook-secret: ${WEBHOOK_SECRET:super-secret-webhook-key-for-local-testing-123}
  claim-ttl-seconds: ${CLAIM_TTL_SECONDS:600}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
